[constants]
target_triple = 'arm64-apple-macos27.0.0'

[binaries]
c = ['clang', '-target', target_triple]
cpp = ['clang++', '-target', target_triple]
c_ld = 'ld64.mold'
cpp_ld = 'ld64.mold'
ar = 'llvm-ar'
strip = 'llvm-strip'
rust = ['rustc', '--target', 'aarch64-apple-darwin']

[built-in options]
rust_args = ['--cfg', 'sha2_backend="soft"', '--cfg', 'sha1_backend="soft"']

[properties]
target_triple = target_triple

[host_machine]
system = 'darwin'
cpu_family = 'aarch64'
cpu = 'cortex-a53'
endian = 'little'
