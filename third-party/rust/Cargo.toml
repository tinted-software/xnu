[package]
name = "third-party"
version = "0.1.0"
edition = "2021"

[workspace]

[lib]
path = "src/lib.rs"

[dependencies]
annotate-snippets = "0.12"
winnow = "1.0"
winnow-args = "0.3.0"
object = { version = "0.40.0", default-features = false, features = ["read_core", "macho"] }

# xnurc dependencies
sha1 = { version = "=0.11.0", default-features = false }
sha2 = { version = "=0.11.1", default-features = false, features = ["zeroize"] }
md-5 = { version = "=0.11.0", default-features = false }
aes = { version = "0.9.2", default-features = false, features = ["zeroize"] }
des = { version = "0.9.0", default-features = false, features = ["zeroize"] }
crypto-bigint = { version = "0.7.5", default-features = false }
chacha20 = { version = "0.10.2", default-features = false, features = ["cipher", "zeroize"] }
poly1305 = { version = "0.9.1", default-features = false, features = ["zeroize"] }
ghash = { version = "0.6.0", default-features = false, features = ["zeroize"] }
subtle = { version = "2.6", default-features = false }
spin = "0.12.3"

# userspace filesystem (read-only APFS reader, no_std + alloc)
hadris-io = { git = "https://github.com/tinted-software/hadris", default-features = false, branch = "theoparis/apfs-write" }
hadris-apfs = { git = "https://github.com/tinted-software/hadris", default-features = false, features = ["encryption", "sync", "write"], branch = "theoparis/apfs-write" }
hadris-fs = { git = "https://github.com/tinted-software/hadris", default-features = false, features = ["sync"], branch = "theoparis/apfs-write" }
hadris-storage = { git = "https://github.com/tinted-software/hadris", default-features = false, features = ["sync"], branch = "theoparis/apfs-write" }
